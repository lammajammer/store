<!doctype html><html><head><meta charset="utf-8"><title>Etsy CSV → Lamajammer JSON</title><style>body{font:16px system-ui;max-width:800px;margin:40px auto;padding:20px}textarea{width:100%;height:220px}button,input{padding:10px;margin:8px 0}</style></head><body><h1>Etsy CSV → products.json</h1><p>Export your active listings CSV from Etsy, choose it here, then download the converted JSON. Review every row before direct-store launch, especially licensing, condition, shipping and inventory.</p><input id="f" type="file" accept=".csv"><button id="go">Convert</button><pre id="out"></pre><script>
function parseCSV(text){const rows=[];let r=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c=='"'&&q&&n=='"'){v+='"';i++;}else if(c=='"')q=!q;else if(c==','&&!q){r.push(v);v=''}else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);rows.push(r)}return rows}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70);
go.onclick=async()=>{const file=f.files[0];if(!file)return;const rows=parseCSV(await file.text());const h=rows.shift().map(x=>x.trim().toUpperCase());const pick=(o,names)=>{for(const n of names){const i=h.indexOf(n);if(i>=0&&o[i])return o[i]}return''};
const products=rows.filter(r=>r.some(Boolean)).map((r,i)=>{const title=pick(r,['TITLE','LISTING TITLE','NAME'])||('Imported product '+(i+1));const imgs=h.map((x,j)=>/^IMAGE/.test(x)?r[j]:'').filter(Boolean);return{id:slug(title)+'-'+(i+1),title,description:pick(r,['DESCRIPTION']),price:Number(pick(r,['PRICE'])||0),quantity:Number(pick(r,['QUANTITY'])||1),category:'Uncategorized',league:'',team:'',status:'draft',featured:false,images:imgs,source:'etsy-csv'}});
const blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='products.json';a.click();out.textContent='Converted '+products.length+' rows. Keep imported items in DRAFT until reviewed.'}
</script></body></html>
